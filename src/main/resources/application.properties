spring.application.name=ferreteria-api

# Perfil activo: variable de entorno o "dev" por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== JPA: las tablas las maneja Flyway =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator: solo health =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

server.port=8080

# ===== Propias de la app =====
app.empresa.ruc=20609876540
app.empresa.razon-social=FERRETERIA EL CONSTRUCTOR SAC
app.cors.origen=${APP_CORS_ORIGEN:http://localhost:3000}
# simulado = FacturadorSimulado (entrega 1) | sunat = SUNAT beta (entrega 2)
app.facturador.tipo=${APP_FACTURADOR_TIPO:simulado}