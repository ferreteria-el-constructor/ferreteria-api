# ===== Base de datos en Azure (todo por variables de entorno) =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pocas conexiones: el plan gratis de MySQL tiene un límite bajo
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.show-sql=false
logging.level.root=INFO