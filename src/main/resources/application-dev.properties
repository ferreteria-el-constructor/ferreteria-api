# ===== Base de datos local =====
# allowPublicKeyRetrieval: lo pide MySQL 8 con usuario root en local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ferreteria_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Ver el SQL en consola para aprender
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true